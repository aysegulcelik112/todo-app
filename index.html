<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kodlama Ajandam</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Kodlama Ajandam</h1>

      <div class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Yapılacak bir görev yazın..."
          aria-label="Yapılacak görev"
        />
        <button id="add-btn" type="button">Ekle</button>
      </div>

      <div class="list-topbar">
        <button id="clear-all-btn" type="button">Tümünü Sil</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
